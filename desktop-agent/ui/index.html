<!DOCTYPE html>
<html lang="en-PH" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PrintRUSH Desktop Agent</title>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/components.css">
<style>
  body { 
    margin: 0; 
    background: var(--bg); 
    color: var(--text); 
    font-family: var(--font-body); 
    height: 100vh; 
    overflow: hidden; 
    display: flex;
  }
  
  .layout-root {
    display: flex;
    width: 100vw;
    height: 100vh;
  }

  .sidebar {
    width: 240px;
    background: var(--bg-alt);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    flex-shrink: 0;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 32px;
    overflow-y: auto;
    background: var(--bg);
  }

  .logo-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 32px;
    padding-left: 8px;
  }

  .logo-mark {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  
  .logo-row {
    display: flex;
    gap: 3px;
  }

  .logo-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
  }
  
  .logo-dot.c { background: var(--cyan); }
  .logo-dot.m { background: var(--magenta); }
  .logo-dot.y { background: var(--yellow); }

  .logo-text {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 14px;
    color: var(--text-muted);
  }

  .nav-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-radius: var(--radius-md);
    color: var(--text-muted);
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all var(--dur-fast);
  }

  .nav-item:hover {
    background: var(--surface);
    color: var(--text);
  }

  .nav-item.active {
    background: rgba(0, 194, 224, 0.08);
    color: var(--cyan);
  }

  .sidebar-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 16px;
    border-top: 1px solid var(--border);
  }

  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(0, 194, 224, 0.08);
    color: var(--cyan);
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Stats Cards Grid */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card-custom {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px;
    display: flex;
    flex-direction: column;
  }

  .stat-card-custom .stat-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.08em;
  }

  .stat-card-custom .stat-value {
    font-family: var(--font-heading);
    font-weight: 900;
    font-size: 36px;
    margin-top: 12px;
    line-height: 1;
  }

  .stat-card-custom.cyan .stat-value { color: var(--cyan); }
  .stat-card-custom.magenta .stat-value { color: var(--magenta); }
  .stat-card-custom.yellow .stat-value { color: var(--yellow); }

  /* Recent Jobs Layout */
  .jobs-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .section-title {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 18px;
    margin: 0;
  }

  .jobs-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .job-card-custom {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    position: relative;
    overflow: hidden;
  }

  .job-card-custom::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
  }

  /* Color themes for job items */
  .job-card-custom.cmyk-c::before { background: var(--cyan); }
  .job-card-custom.cmyk-m::before { background: var(--magenta); }
  .job-card-custom.cmyk-y::before { background: var(--yellow); }

  .job-info {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .job-name {
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
  }

  .job-meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .badge-custom {
    display: inline-flex;
    align-items: center;
    padding: 6px 14px;
    border-radius: var(--radius-md);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .badge-custom.cyan {
    background: rgba(0, 194, 224, 0.1);
    color: var(--cyan);
  }

  .badge-custom.magenta {
    background: rgba(232, 0, 125, 0.1);
    color: var(--magenta);
  }

  /* Walk-in Modal */
  .walkin-modal { 
    display: none; 
    position: fixed; 
    inset: 0; 
    background: rgba(0,0,0,0.8); 
    z-index: 1000; 
    padding: 20px; 
    justify-content: center; 
    align-items: center; 
    backdrop-filter: blur(4px);
  }
  
  .walkin-modal.open { 
    display: flex; 
  }
  
  .walkin-card { 
    background: var(--surface); 
    border-radius: var(--radius-xl); 
    padding: 28px; 
    max-width: 420px; 
    width: 100%; 
    border: 1px solid var(--border); 
    box-shadow: var(--shadow-xl);
  }
  
  .file-info { 
    background: var(--bg); 
    padding: 14px; 
    border-radius: var(--radius-md); 
    border: 1.5px dashed var(--cyan-20); 
    margin: 18px 0; 
    font-family: monospace; 
    font-size: 12px; 
    color: var(--text-muted); 
    word-break: break-all; 
  }
</style>
</head>
<body>

<div class="layout-root">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo-wrap">
      <div class="logo-mark">
        <div class="logo-row">
          <div class="logo-dot c"></div>
          <div class="logo-dot m"></div>
        </div>
        <div class="logo-row" style="justify-content: center;">
          <div class="logo-dot y"></div>
        </div>
      </div>
      <span class="logo-text">PrintRUSH Desktop Agent</span>
    </div>

    <nav class="nav-list">
      <div class="nav-item active">
        <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        Queue
      </div>
      <div class="nav-item">
        <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
        Devices
      </div>
      <div class="nav-item">
        <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        Settings
      </div>
    </nav>

    <div class="sidebar-footer">
      <div class="status-badge">● Online</div>
    </div>
  </aside>

  <!-- Main Content Panel -->
  <main class="main-content">
    <!-- Top Stats Cards -->
    <div class="stats-grid">
      <div class="stat-card-custom cyan">
        <span class="stat-label">In Progress</span>
        <div id="statInProgress" class="stat-value">0</div>
      </div>
      <div class="stat-card-custom magenta">
        <span class="stat-label">Waiting</span>
        <div id="statWaiting" class="stat-value">0</div>
      </div>
      <div class="stat-card-custom yellow">
        <span class="stat-label">Done Today</span>
        <div id="statDone" class="stat-value">0</div>
      </div>
    </div>

    <!-- Recent Jobs Section -->
    <div class="jobs-section">
      <h3 class="section-title">Recent Jobs</h3>
      <div id="queueList" class="jobs-list">
        <div style="color:var(--text-muted);font-size:14px;font-style:italic;">Loading queue...</div>
      </div>
    </div>
  </main>
</div>

<!-- New Walk-in Job Modal -->
<div id="walkinModal" class="walkin-modal">
  <div class="walkin-card">
    <h2 style="margin:0 0 8px;color:var(--cyan);font-family:var(--font-heading);">Bluetooth File Received!</h2>
    <div style="font-size:13px;color:var(--text-muted);">A new file was beamed to this computer. Create a walk-in job for it?</div>
    
    <div class="file-info" id="fileNameDisplay"></div>
    
    <div class="form-group" style="margin-bottom: 16px;">
      <label class="form-label">Service Type</label>
      <select id="serviceSelect" class="form-select">
        <option value="documents">Documents & Copies (₱2/pg)</option>
        <option value="photo">Photo Printing (₱20/pc)</option>
        <option value="tarpaulin">Tarpaulin (₱20/sqft)</option>
      </select>
    </div>
    
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom: 24px;">
      <div class="form-group">
        <label class="form-label">Pages/Sqft</label>
        <input type="number" id="pagesInput" class="form-input" value="1" min="1">
      </div>
      <div class="form-group">
        <label class="form-label">Copies</label>
        <input type="number" id="copiesInput" class="form-input" value="1" min="1">
      </div>
    </div>
    
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <button class="btn btn-ghost" id="cancelWalkinBtn">Dismiss</button>
      <button class="btn btn-primary" id="createWalkinBtn">Add to Queue</button>
    </div>
  </div>
</div>

<script src="./supabase.js"></script>
<script src="./renderer.js"></script>
</body>
</html>
